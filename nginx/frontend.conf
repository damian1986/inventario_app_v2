# Reemplazo de /etc/nginx/conf.d/default.conf para el contenedor inventario_frontend.
# Objetivo: servir el frontend estático sin caché heurística en el HTML, de modo que
# index.html siempre se revalide (Last-Modified/ETag) y los usuarios reciban las
# actualizaciones sin necesidad de recargar con Ctrl+Shift+R.
# Los assets JS/CSS ya están versionados con ?v= (URL cambia al actualizar), así que
# no necesitan cabeceras extra.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # index.html: sin caché (la petición a "/" hace redirect interno a /index.html
    # y vuelve a evaluar location matching, por lo que este bloque también aplica).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
