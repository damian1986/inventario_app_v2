
services:
  db:
    image: postgres:16-alpine
    container_name: inventario_db
    restart: unless-stopped
    # ⚠️ PUERTO 5432 MAPEADO AL HOST — se conserva a propósito (2026-09-30)
    # para herramientas de BD locales y ejecución del backend fuera de Docker.
    # ACCIÓN OBLIGATORIA antes de desplegar en VPS: eliminar el mapeo
    # "5432:5432" (la app usa la red interna de Docker; el host no lo necesita).
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - TZ=America/Mexico_City
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: inventario_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Mexico_City
      - IS_DOCKER=1
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backups:/app/backups

  frontend:
    image: nginx:alpine
    container_name: inventario_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      # Config propia del frontend: sirve index.html sin caché heurística.
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
